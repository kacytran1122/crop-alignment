name: quality

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3" "pymupdf>=1.24,<2" "pypdf>=5,<7"
      - run: python crop_alignment.py
      - run: python experiments/sea_ice/src/verify_paper_numbers.py
      - run: python -m compileall -q crop_alignment.py experiments/sea_ice/src experiments/floods/src
      - run: bash -n experiments/sea_ice/src/*.sh experiments/floods/src/*.sh
      - run: python paper/validate_layout.py
      - run: python paper/validate_submission.py

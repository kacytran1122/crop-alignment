name: quality

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3" "pymupdf>=1.24,<2" "pypdf>=5,<7"
      - run: python cropalign.py
      - run: python tests_cropalign_hardening.py
      - run: python gate7_rebuild/src/verify_draft_numbers.py
        env:
          VERIFY_ALLOW_NO_MANIFEST: "1"
      - run: python -m compileall -q cropalign.py verify.py gate7_rebuild/src gate8_crossdomain/src
      - run: bash -n gate7_rebuild/src/*.sh gate8_crossdomain/src/*.sh
      - run: python paper/check_layout.py
      - run: python paper/check_presentation.py
        env:
          PRESENTATION_ALLOW_NO_LOGS: "1"
